# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm1_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    arm2_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    arm1_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    arm2_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm1_controller:
  ros__parameters:
    joints:
      - arm1_joint_1
      - arm1_joint_2
      - arm1_joint_3
      - arm1_joint_4
      - arm1_joint_5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
arm2_controller:
  ros__parameters:
    joints:
      - arm2_joint_1
      - arm2_joint_2
      - arm2_joint_3
      - arm2_joint_4
      - arm2_joint_5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
arm1_gripper_controller:
  ros__parameters:
    joints:
      - arm1_end_effector
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
arm2_gripper_controller:
  ros__parameters:
    joints:
      - arm2_end_effector
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true