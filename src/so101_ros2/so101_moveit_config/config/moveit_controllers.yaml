# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm1_controller
    - arm2_controller
    - arm1_gripper_controller
    - arm2_gripper_controller

  arm1_controller:
    type: FollowJointTrajectory
    joints:
      - arm1_joint_1
      - arm1_joint_2
      - arm1_joint_3
      - arm1_joint_4
      - arm1_joint_5
  arm2_controller:
    type: FollowJointTrajectory
    joints:
      - arm2_joint_1
      - arm2_joint_2
      - arm2_joint_3
      - arm2_joint_4
      - arm2_joint_5
  arm1_gripper_controller:
    type: FollowJointTrajectory
    joints:
      - arm1_end_effector
  arm2_gripper_controller:
    type: FollowJointTrajectory
    joints:
      - arm2_end_effector